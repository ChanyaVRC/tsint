[package]
name = "tsint"
version = "0.1.0"
edition = "2021"
description = "完全自作 TypeScript インタプリタ（Noiria エンジン用）。T2: バイトコードコンパイラ + 明示スタック VM。T3: Promise / async・await / イベントループ。T4: 正規表現エンジン本実装。"
license = "MIT"
repository = "https://github.com/ChanyaVRC/tsint"
documentation = "https://docs.rs/tsint"
readme = "README.md"
keywords = ["typescript", "javascript", "interpreter", "vm", "bytecode"]
categories = ["compilers", "parser-implementations"]

# 方針: 依存クレートはゼロ。dev-dependencies も追加しない（std のみで完結させる）。
[dependencies]

[lib]
name = "tsint"
path = "src/lib.rs"
